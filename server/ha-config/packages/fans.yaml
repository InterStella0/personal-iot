# Both fans as fan entities, so voice, Claude and Google see a fan instead of buttons.
#
# Home fan: an IR fan whose remote buttons are DIY buttons in Smart Life. HA can't press those
# directly, so create one Tap-to-Run scene per button in Smart Life, each pressing only that
# button, named exactly:
#   Home fan power, Home fan speed 1, Home fan speed 2, Home fan speed 3
# The Tuya integration turns them into scene.home_fan_power, scene.home_fan_speed_1, ...
# IR is one-way, so HA keeps an assumed state in two helpers. If someone uses the physical
# remote, correct the helpers from the UI; changing them doesn't press anything.
#
# Second house fan: plugged into a Tuya switch, so it only turns on and off.
#
# Replace the entity ids marked CHANGE with yours (Settings > Devices & services > Entities).

input_boolean:
  home_fan_on:
    name: Home fan on (assumed)
    icon: mdi:fan

input_number:
  home_fan_speed:
    name: Home fan speed (assumed)
    icon: mdi:fan-speed-2
    min: 1
    max: 3
    step: 1

script:
  home_fan_set:
    alias: Set the home fan
    mode: queued # one change at a time, so presses never interleave
    fields:
      speed:
        description: 0 turns the fan off, 1-3 turns it on at that speed.
        required: true
        selector:
          number:
            min: 0
            max: 3
    variables:
      power_scene: scene.home_fan_power # CHANGE these four if your scene ids differ
      speed_scenes:
        1: scene.home_fan_speed_1
        2: scene.home_fan_speed_2
        3: scene.home_fan_speed_3
    sequence:
      # Read the state here, not above, so a queued run sees what the previous run left.
      - variables:
          target: "{{ speed | int }}"
          was_on: "{{ is_state('input_boolean.home_fan_on', 'on') }}"
          current: "{{ states('input_number.home_fan_speed') | int(1) }}"
      # The fan resumes its last speed when powered on, so press speed only if it changes.
      # Each press is a cloud call; the delays keep the blaster from dropping one.
      - if: "{{ (target > 0) != was_on }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: "{{ power_scene }}"
          - delay: 1
      - if: "{{ target > 0 and target != current }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: "{{ speed_scenes[target] }}"
          - delay: 1
      - action: "input_boolean.turn_{{ 'on' if target > 0 else 'off' }}"
        target:
          entity_id: input_boolean.home_fan_on
      - if: "{{ target > 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.home_fan_speed
            data:
              value: "{{ target }}"

template:
  - fan:
      - name: Home fan
        unique_id: home_fan
        state: "{{ is_state('input_boolean.home_fan_on', 'on') }}"
        # HA's convention for 3 speeds: 33 / 66 / 100 percent.
        percentage: >-
          {{ states('input_number.home_fan_speed') | int(1) * 100 // 3
             if is_state('input_boolean.home_fan_on', 'on') else 0 }}
        speed_count: 3
        turn_on:
          - action: script.home_fan_set
            data:
              # Without a percentage, resume the last speed.
              speed: >-
                {{ (percentage * 3 / 100) | round(0, 'ceil') | int if percentage
                   else states('input_number.home_fan_speed') | int(1) }}
        turn_off:
          - action: script.home_fan_set
            data:
              speed: 0
        set_percentage:
          - action: script.home_fan_set
            data:
              speed: "{{ (percentage * 3 / 100) | round(0, 'ceil') | int }}"

      - name: Second house fan
        unique_id: second_house_fan
        # CHANGE switch.second_house_fan here and in the two actions below.
        availability: "{{ has_value('switch.second_house_fan') }}"
        state: "{{ is_state('switch.second_house_fan', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.second_house_fan
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.second_house_fan
