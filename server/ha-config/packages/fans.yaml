# The home fan as a fan entity, so voice, Claude and Google see a fan instead of buttons.
#
# Home fan: an IR fan whose remote buttons are DIY buttons in Smart Life. HA can't press those
# directly, so each button has a Tap-to-Run scene in Smart Life that presses only that button:
#   Fan off, Set Fan 1, Set Fan 2, Set Fan 3, Set Fan 4
# A speed button also turns the fan on. The Tuya integration turns the scenes into scene.*
# entities; reload it after adding a scene in Smart Life.
# IR is one-way, so HA keeps an assumed state in two helpers. If someone uses the physical
# remote, correct the helpers from the UI; changing them doesn't press anything.

input_boolean:
  home_fan_on:
    name: Home fan on (assumed)
    icon: mdi:fan

input_number:
  home_fan_speed:
    name: Home fan speed (assumed)
    icon: mdi:fan-speed-2
    min: 1
    max: 4
    step: 1

script:
  home_fan_set:
    alias: Set the home fan
    mode: queued # one change at a time, so presses never interleave
    fields:
      speed:
        description: 0 turns the fan off, 1-4 turns it on at that speed.
        required: true
        selector:
          number:
            min: 0
            max: 4
    variables:
      scenes:
        0: scene.fan_off
        1: scene.set_fan_1
        2: scene.set_fan_2
        3: scene.set_fan_3
        4: scene.set_fan_4
    sequence:
      - variables:
          target: "{{ speed | int }}"
      - action: scene.turn_on
        target:
          entity_id: "{{ scenes[target] }}"
      - action: "input_boolean.turn_{{ 'on' if target > 0 else 'off' }}"
        target:
          entity_id: input_boolean.home_fan_on
      - if: "{{ target > 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.home_fan_speed
            data:
              value: "{{ target }}"
      # Each press is a cloud call; pace queued presses so the blaster doesn't drop one.
      - delay: 1

template:
  - fan:
      - name: Home fan
        unique_id: home_fan
        state: "{{ is_state('input_boolean.home_fan_on', 'on') }}"
        # HA's convention for 4 speeds: 25 / 50 / 75 / 100 percent.
        percentage: >-
          {{ states('input_number.home_fan_speed') | int(1) * 100 // 4
             if is_state('input_boolean.home_fan_on', 'on') else 0 }}
        speed_count: 4
        turn_on:
          - action: script.home_fan_set
            data:
              # Without a percentage, resume the last speed.
              speed: >-
                {{ (percentage * 4 / 100) | round(0, 'ceil') | int if percentage
                   else states('input_number.home_fan_speed') | int(1) }}
        turn_off:
          - action: script.home_fan_set
            data:
              speed: 0
        set_percentage:
          - action: script.home_fan_set
            data:
              speed: "{{ (percentage * 4 / 100) | round(0, 'ceil') | int }}"

