default_config:

homeassistant:
  # One YAML file per feature in packages/, e.g. packages/jev_ac.yaml.
  packages: !include_dir_named packages

http:
  # Cloudflare Tunnel forwards requests, so HA must trust the proxy's address. A request
  # carrying X-Forwarded-For from an address not listed here is rejected with 400.
  #
  # HA 2026.8+ imports this block once, on first start, into Settings > System > Network
  # (.storage/http), then ignores it and raises a repair asking to remove it. It stays here
  # so a fresh install starts with the right settings. Change it later in the UI.
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.31.0.1 # gateway of the compose network: cloudflared's requests arrive from here

# Written by the UI editors.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
