default_config:

homeassistant:
  # One YAML file per feature in packages/, e.g. packages/jev_ac.yaml.
  packages: !include_dir_named packages

# No `http:` block: since HA 2026.8 the HTTP settings, including the reverse proxy trust the
# Cloudflare Tunnel needs, live in .storage/http. A YAML block is only imported as a 5-minute
# trial that reverts unless an admin confirms it, so the README seeds .storage/http instead.

# Written by the UI editors.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
