name: personal-iot

services:
  homeassistant:
    # Pinned: upgrade on purpose after reading the release notes.
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    container_name: homeassistant
    # Loopback for cloudflared, plus the server's Tailscale address for the tailnet. Never
    # 0.0.0.0: Docker-published ports skip ufw and would be public. Devices are reached through
    # Tuya's cloud, so HA needs no LAN access.
    ports:
      - 127.0.0.1:8123:8123
      - ${TAILSCALE_IP:?set TAILSCALE_IP in .env (setup.sh does)}:8123:8123
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # Zigbee/Matter radios need hardware at the house, not on this server.

  # Phase 2: `docker compose --profile voice up -d`, then add both in HA through the Wyoming integration.
  whisper:
    profiles: [voice]
    image: rhasspy/wyoming-whisper:3.8.1
    # A standard (not distil) model, so the HA name biasing below works. tiny-int8 is too weak for accents.
    command: --model ${WHISPER_MODEL:-small} --language ${WHISPER_LANGUAGE:-en}
    # Biases transcription toward the names of devices exposed to Assist ("kipas", "aircond").
    # Check that this image ships the [hass] extra before relying on it.
    #   command: >-
    #     --model ${WHISPER_MODEL:-small} --language ${WHISPER_LANGUAGE:-en}
    #     --hass-api http://homeassistant:8123/api
    # environment:
    #   WYO_WHISPER_HASS_TOKEN_FILE: /run/secrets/whisper_hass_token
    volumes:
      - ./data/whisper:/data
    ports:
      - 127.0.0.1:10300:10300
    restart: unless-stopped

  piper:
    profiles: [voice]
    image: rhasspy/wyoming-piper:2.5.2
    command: --voice ${PIPER_VOICE:-en_US-lessac-medium}
    volumes:
      - ./data/piper:/data
    ports:
      - 127.0.0.1:10200:10200
    restart: unless-stopped

  # Wake word detection for the desktop app's "Always listen".
  openwakeword:
    profiles: [voice]
    image: rhasspy/wyoming-openwakeword:2.1.0
    ports:
      - 127.0.0.1:10400:10400
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed, so http-seed.json can trust the gateway: requests through the published
        # port (from cloudflared) reach HA from 172.31.0.1.
        - subnet: 172.31.0.0/24
